        '200':
          description: No response body
  /api/users/impersonate/:
    post:
      operationId: users_impersonate_create
      description: |-
        Generate JWT tokens for a target user.
        Strictly Super Admin only.
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/password-reset-confirm/:
    post:
      operationId: users_password_reset_confirm_create
      description: Endpoint to confirm a password reset using the token from the email
        link.
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/users/password-reset-request/:
    post:
      operationId: users_password_reset_request_create
      description: |-
        Request a password reset link.

        Staff and parents: {"email"}. Students: {"student_no", "email"} where email is the parent email the
        school has on record; the link goes to that address. The response is the same whether or not an
        account matched, so this can't be used to discover accounts.
      tags:
      - users
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
