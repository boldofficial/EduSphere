openapi: 3.0.3
info:
  title: Registra API
  version: 1.0.0
  description: Multi-tenant School Management System API
paths:
  /api/academic/ai-insights/:
    get:
      operationId: academic_ai_insights_retrieve
      description: Term-wide insights for admins based on all student data.
      tags:
      - academic
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/academic/ai-lesson-plan/:
    post:
      operationId: academic_ai_lesson_plan_create
      description: |-
        AI-powered lesson plan generation.
        POST /academic/ai-lesson-plan/
        Body: { subject, class_name, topic, duration_minutes, objectives?, notes? }
      tags:
      - academic
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/academic/analytics/:
    get:
      operationId: academic_analytics_retrieve
      description: GET /api/academic/analytics/?session=2025/2026
      tags:
      - academic
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
