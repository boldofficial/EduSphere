          minLength: 1
          maxLength: 255
        session:
          type: string
          minLength: 1
          maxLength: 50
        term:
          type: string
          minLength: 1
          maxLength: 50
        published_by:
          type: string
          maxLength: 100
        is_published:
          type: boolean
      required:
      - session
      - term
      - title
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        category:
          $ref: '#/components/schemas/NotificationCategoryEnum'
        link:
          type: string
          description: Deep link path e.g. /dashboard/reports
          maxLength: 500
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
    NotificationCategoryEnum:
      enum:
      - academic
      - bursary
      - attendance
      - announcement
      - system
      type: string
      description: |-
        * `academic` - Academic
        * `bursary` - Bursary
        * `attendance` - Attendance
        * `announcement` - Announcement
        * `system` - System
    Option:
      type: object
      description: 'Serializer mixin: drop `learner_hidden_fields` from output for
        students and parents.'
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
        is_correct:
          type: boolean
        school:
          type: integer
          readOnly: true
      required:
      - id
      - school
    OptionRequest:
      type: object
      description: 'Serializer mixin: drop `learner_hidden_fields` from output for
        students and parents.'
      properties:
        text:
          type: string
        is_correct:
          type: boolean
    OverallRatingEnum:
