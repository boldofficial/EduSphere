name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff black==26.10.1

      - name: Run Ruff linter
        working-directory: backend
        run: ruff check .

      - name: Check code formatting with Black
        working-directory: backend
        run: black --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip uv
          # Same install as the production Dockerfile: locked dependencies via uv.
          uv sync --frozen --no-install-project

      - name: Check the OpenAPI schema is up to date
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
        run: |
          uv run --no-sync python manage.py spectacular --file /tmp/openapi.yml
          if ! diff -q openapi.yml /tmp/openapi.yml; then
            d=$(diff -u openapi.yml /tmp/openapi.yml | head -60 | awk '{printf "%s%%0A", $0}')
            echo "::error::backend/openapi.yml is stale. Run 'npm run api:schema && npm run api:types' and commit.%0A$d"
            exit 1
          fi

      - name: Run Django tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'False'
        run: |
          set -o pipefail
          uv run --no-sync python manage.py test --verbosity=2 2>&1 | tee /tmp/django-tests.log || {
            # Surface failing test names (and their assertion) as annotations on the run.
            grep -E "^(FAIL|ERROR):" /tmp/django-tests.log | head -20 | sed 's/^/::error::/'
            grep -E "^(AssertionError|[A-Za-z]+Error):" /tmp/django-tests.log | head -10 | sed 's/^/::error::/'
            exit 1
          }

      - name: Upload coverage to Codecov
        working-directory: backend
        if: success()
        run: |
          uv run --no-sync --with coverage coverage run manage.py test --verbosity=0
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/uv.lock

      - name: Install security tools
        working-directory: backend
        run: |
          pip install pip-audit safety bandit

      - name: Check for vulnerable dependencies
        working-directory: backend
        run: |
          pip-audit || true
          safety check || true

      - name: Run Bandit security scan
        working-directory: backend
        run: |
          bandit -r . -x ./migrations,./tests,./venv || true
